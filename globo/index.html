<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Globo (react-globe.gl) — Centros de IA no Mundo</title>
  <style>
    /* Paleta OCIAAM (alinhada ao index.html) */
    :root {
      --p:  #0a6878;   /* teal primário */
      --pm: #1694aa;   /* teal médio */
      --pl: #e0f2f7;   /* teal claro */
      --bg: #ffffff;
      --t1: #111827;
      --t2: #374151;
      --t3: #6b7280;
    }
    html, body { margin: 0; padding: 0; height: 100%; background: var(--bg); overflow: hidden; font-family: 'Plus Jakarta Sans', system-ui, sans-serif; }
    #globe { width: 100vw; height: 100vh; }
    #info {
      position: absolute; top: 16px; left: 16px; z-index: 10;
      color: var(--t2); background: rgba(255,255,255,.8); backdrop-filter: blur(6px);
      padding: 12px 16px; border-radius: 10px; max-width: 280px; font-size: 13px;
      border: 1px solid var(--pl); line-height: 1.4; box-shadow: 0 4px 20px rgba(10,104,120,.08);
    }
    #info h1 { margin: 0 0 4px; font-size: 16px; color: var(--p); }
    #info .count { color: var(--pm); font-weight: 700; }
    .loading { position: absolute; inset: 0; display: grid; place-items: center; color: var(--pm); font-size: 18px; z-index: 5; }
    #panel {
      position: absolute; top: 16px; right: 16px; z-index: 20; width: 320px;
      max-height: calc(100vh - 32px); overflow-y: auto;
      color: var(--t2); background: rgba(255,255,255,.92); backdrop-filter: blur(8px);
      padding: 16px 18px; border-radius: 12px; font-size: 13px; line-height: 1.5;
      border: 1px solid var(--pl); box-shadow: 0 8px 30px rgba(10,104,120,.15);
    }
    #panel h2 { margin: 0 24px 8px 0; font-size: 16px; color: var(--p); }
    #panel .field { margin-top: 8px; }
    #panel .label { color: var(--pm); font-weight: 600; font-size: 11px; text-transform: uppercase; letter-spacing: .04em; }
    #panel a { color: var(--p); word-break: break-all; }
    #panel .close {
      position: absolute; top: 12px; right: 12px; cursor: pointer;
      color: var(--t3); background: none; border: none; font-size: 20px; line-height: 1;
    }
    #panel .close:hover { color: var(--p); }
    #controls {
      position: absolute; left: 16px; bottom: 16px; z-index: 20; max-width: 340px;
      color: var(--t2); background: rgba(255,255,255,.92); backdrop-filter: blur(8px);
      padding: 12px 14px; border-radius: 12px; font-size: 13px;
      border: 1px solid var(--pl); box-shadow: 0 8px 30px rgba(10,104,120,.15);
    }
    #controls .ctl-label { color: var(--pm); font-weight: 600; font-size: 11px; text-transform: uppercase; letter-spacing: .04em; margin-bottom: 6px; }
    #controls .seg { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 12px; }
    #controls .seg button {
      border: 1px solid var(--pl); background: #fff; color: var(--t2);
      padding: 6px 10px; border-radius: 8px; cursor: pointer; font: inherit; font-size: 12px;
      transition: all .15s ease;
    }
    #controls .seg button:hover { border-color: var(--pm); }
    #controls .seg button.active { background: var(--p); border-color: var(--p); color: #fff; }
    #controls select {
      width: 100%; padding: 7px 9px; border: 1px solid var(--pl); border-radius: 8px;
      background: #fff; color: var(--t2); font: inherit; font-size: 12px; cursor: pointer;
    }
    #controls .hint { margin-top: 8px; font-size: 11px; color: var(--t3); }
    #back {
      position: absolute; top: 16px; right: 16px; z-index: 30;
      display: inline-flex; align-items: center; gap: 7px;
      color: var(--p); background: rgba(255,255,255,.92); backdrop-filter: blur(8px);
      padding: 9px 14px; border-radius: 10px; font-size: 13px; font-weight: 600;
      text-decoration: none; border: 1px solid var(--pl);
      box-shadow: 0 4px 20px rgba(10,104,120,.12); transition: all .15s ease;
    }
    #back:hover { background: var(--p); color: #fff; border-color: var(--p); }
    /* Painel de detalhes abre abaixo do botão de voltar */
    #panel { top: 64px; max-height: calc(100vh - 80px); }
  </style>

  <!-- Vercel Web Analytics (sem cookies, dados agregados/anônimos — respeita LGPD) -->
  <script defer src="/_vercel/insights/script.js"></script>
</head>
<body>
  <div id="info">
    <h1>Centros de IA no Mundo</h1>
    <div><span class="count" id="count">…</span> instituições</div>
    <div style="margin-top:6px; opacity:.7">Passe o mouse sobre um ponto. Arraste para girar, clique para ver os detalhes.</div>
  </div>
  <a id="back" href="../index.html#mundo">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" width="15" height="15">
      <line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/>
    </svg>
    Voltar ao portal
  </a>
  <div class="loading" id="loading">Carregando globo…</div>
  <div id="globe"></div>

  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/react-globe.gl@2.27.3/dist/react-globe.gl.min.js"></script>
  <!-- Pinned to 7.x: Babel 8's preset-react defaults to the automatic JSX runtime,
       which injects `import {jsx} from "react/jsx-runtime"` into the compiled inline
       script and breaks it (this page uses the classic runtime via the UMD React global). -->
  <script src="https://unpkg.com/@babel/standalone@7/babel.min.js"></script>
  <script src="./markers.js"></script>

  <script type="text/babel" data-presets="react">
    const { useMemo, useState } = React;
    const Globe = window.Globe; // UMD global from react-globe.gl

    // Paleta OCIAAM
    const P = '#0a6878', PM = '#1694aa', PL = '#e0f2f7';
    // Cor de destaque das barras (coral → rosa por tamanho)
    const BAR_LO = '#fb7185', BAR_HI = '#e11d48';

    function Panel({ d, onClose }) {
      if (!d) return null;
      const Field = ({ label, children }) =>
        children ? (
          <div className="field">
            <div className="label">{label}</div>
            <div>{children}</div>
          </div>
        ) : null;
      return (
        <div id="panel">
          <button className="close" onClick={onClose}>×</button>
          <h2>{d.nome || 'Centro de IA'}</h2>
          <Field label="Universidade">{d.universidade}</Field>
          <Field label="Cidade">{d.cidade}</Field>
          <Field label="Áreas">{d['áreas']}</Field>
          <Field label="Liderança">{d['liderança']}</Field>
          <Field label="Pesquisadores">{d.pesquisadores}</Field>
          <Field label="E-mail">{d.email}</Field>
          <Field label="Site">
            {d.url ? <a href={d.url} target="_blank" rel="noreferrer">{d.url}</a> : null}
          </Field>
        </div>
      );
    }

    // Conta itens de uma lista separada por vírgula
    const countList = (s) => (s || '').split(',').map(x => x.trim()).filter(Boolean).length;
    const countResearchers = (m) => countList(m.pesquisadores);
    const countAreas = (m) => countList(m['áreas']);

    // Normaliza o nome do país: remove parênteses (ex.: "China (中国)") e unifica grafias/idiomas
    const ALIAS = {
      'united states of america': 'United States', 'united states': 'United States',
      'canadá': 'Canada', 'méxico': 'Mexico', 'espanha': 'Spain', 'eslovenia': 'Slovenia',
    };
    const cleanCountry = (raw) => (raw || '').replace(/\s*[\(（].*$/, '').trim();
    const canonCountry = (raw) => {
      const c = cleanCountry(raw);
      return ALIAS[c.toLowerCase()] || c;
    };
    const countryOf = (m) => canonCountry((m.cidade || '').split(',').pop());

    // Muitos centros têm coordenadas idênticas (mesma universidade), o que
    // empilha as torres no mesmo ponto: a torre visível é a mais alta do grupo,
    // mas o tooltip pode ser de outro centro. Espalha os co-localizados numa
    // espiral (phyllotaxis) para que cada torre fique distinta.
    // O raio é normalizado pelo tamanho do grupo (i/(n-1)) e limitado a R_MAX,
    // então TODO o grupo cabe num disco de ~4 km da posição real — independente
    // de ter 2 ou 28 pontos. (Antes era 0.35*sqrt(i), que jogava grupos grandes
    // até ~200 km, parando no mar.) Mantém a fidelidade geográfica.
    const R_MAX = 0.04; // graus (~4.4 km)
    const spreadOverlaps = (arr) => {
      const groups = {};
      arr.forEach(d => {
        const k = `${d.lat},${d.lng}`;
        (groups[k] = groups[k] || []).push(d);
      });
      const GA = Math.PI * (3 - Math.sqrt(5)); // ângulo áureo
      Object.values(groups).forEach(g => {
        if (g.length < 2) return;
        g.forEach((d, i) => {
          const r = R_MAX * Math.sqrt(i / (g.length - 1)); // i=0 mantém a posição original
          d.lat += r * Math.sin(i * GA);
          d.lng += r * Math.cos(i * GA) / Math.max(0.2, Math.cos(d.lat * Math.PI / 180));
        });
      });
      return arr;
    };

    // Métricas selecionáveis: rótulo + valor por centro + unidade no tooltip
    const METRICS = {
      pesq:  { label: 'Pesquisadores', val: d => d.nPesq,  bars: 'pesquisadores' },
      areas: { label: 'Tópicos',       val: d => d.nAreas, bars: 'tópicos de pesquisa' },
      pais:  { label: 'Centros/país',  val: d => d.nPais,  bars: 'centros no país' },
    };

    // Interpola entre dois hex (#rrggbb) por t∈[0,1]
    const lerpColor = (a, b, t) => {
      const h = x => [1,3,5].map(i => parseInt(x.slice(i, i+2), 16));
      const [r1,g1,b1] = h(a), [r2,g2,b2] = h(b);
      const m = (u,v) => Math.round(u + (v-u)*t);
      return `rgb(${m(r1,r2)},${m(g1,g2)},${m(b1,b2)})`;
    };

    // Oceano: cor sólida teal claro (#e0f2f7) como textura 1px
    const OCEAN = 'data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAIAAAACCAIAAAD91JpzAAAAEElEQVR42mN48Ok7EDFAKABNrgslwcN+/wAAAABJRU5ErkJggg==';

    function App() {
      const [selected, setSelected] = useState(null);
      const [countries, setCountries] = useState([]);
      const [metric, setMetric] = useState('pesq');

      // Carrega os países (Natural Earth, vetorial = nítido em qualquer zoom)
      React.useEffect(() => {
        fetch('./countries.geojson')
          .then(r => r.json())
          .then(geo => setCountries(geo.features))
          .catch(() => {});
      }, []);

      // Enriquece cada centro com as métricas e localização; calcula os máximos (escala fixa)
      const { data, maxByMetric } = useMemo(() => {
        const base = (window.MARKERS || []).map(m => {
          const country = countryOf(m);
          return { ...m, nPesq: countResearchers(m), nAreas: countAreas(m), country };
        });
        const perCountry = {};
        base.forEach(d => { perCountry[d.country] = (perCountry[d.country] || 0) + 1; });
        const arr = spreadOverlaps(base.map(d => ({ ...d, nPais: perCountry[d.country] })));
        const maxByMetric = {};
        Object.keys(METRICS).forEach(k => { maxByMetric[k] = Math.max(1, ...arr.map(METRICS[k].val)); });
        return { data: arr, maxByMetric };
      }, []);

      // Valor da métrica atual, normalizado pela escala global.
      // Altura e cor são gravadas em cada ponto e o array é recriado:
      // o globo só recalcula a geometria das torres quando os dados mudam,
      // trocar apenas a função de altura não dispara o redesenho.
      const M = METRICS[metric];
      const maxN = maxByMetric[metric];
      const points = useMemo(() => {
        data.forEach(d => {
          const t = Math.sqrt(M.val(d) / maxN);
          d.alt = 0.02 + 0.30 * t;
          d.color = lerpColor(BAR_LO, BAR_HI, t);
        });
        return [...data];
      }, [data, metric]);

      // Anéis pulsantes nos 25 maiores da métrica atual.
      // IMPORTANTE: cópias {lat,lng}, nunca os mesmos objetos de pointsData —
      // o globe.gl grava o objeto 3D de cada camada no próprio dado (__threeObj),
      // então compartilhar objetos entre camadas corrompe o vínculo e congela
      // as torres dos pontos que ganham anel.
      const rings = useMemo(
        () => [...data].sort((a, b) => M.val(b) - M.val(a)).slice(0, 25)
          .map(d => ({ lat: d.lat, lng: d.lng })),
        [data, metric]
      );

      React.useEffect(() => { document.getElementById('loading').style.display = 'none'; }, []);
      React.useEffect(() => { document.getElementById('count').textContent = data.length; }, [data]);

      const tip = (d) => `
        <div style="font-family:'Plus Jakarta Sans',system-ui;font-size:12px;color:#374151;background:#fff;
             padding:8px 10px;border-radius:8px;max-width:240px;border:1px solid ${PL};box-shadow:0 4px 16px rgba(10,104,120,.18)">
          <div style="font-weight:700;margin-bottom:3px;color:${P}">${d.nome || 'Centro de IA'}</div>
          ${d.universidade ? `<div style="opacity:.85">${d.universidade}</div>` : ''}
          ${d.cidade ? `<div style="opacity:.6;margin-top:3px">${d.cidade}</div>` : ''}
          <div style="margin-top:4px;color:${PM};font-weight:600">${M.val(d)} ${M.bars}</div>
        </div>`;

      // Anéis pulsantes: destaques fixos + o ponto selecionado (também como cópia)
      const ringsData = selected ? [...rings, { lat: selected.lat, lng: selected.lng }] : rings;

      return (
        <React.Fragment>
          <Globe
            backgroundColor="#ffffff"
            globeImageUrl={OCEAN}
            showGraticules={true}
            polygonsData={countries}
            polygonCapColor={() => 'rgba(10,104,120,0.92)'}
            polygonSideColor={() => 'rgba(22,148,170,0.35)'}
            polygonStrokeColor={() => '#e0f2f7'}
            polygonAltitude={0.007}
            polygonLabel={({ properties: p }) => `
              <div style="font-family:'Plus Jakarta Sans',system-ui;font-size:12px;font-weight:700;
                   color:#fff;background:${P};padding:4px 10px;border-radius:6px;
                   box-shadow:0 4px 12px rgba(10,104,120,.3)">
                ${p.NAME_PT || p.NAME || p.ADMIN || ''}
              </div>`}
            pointsData={points}
            pointLat="lat"
            pointLng="lng"
            pointColor="color"
            pointAltitude="alt"
            pointRadius={0.22}
            pointLabel={tip}
            pointsTransitionDuration={800}
            onPointClick={(d) => setSelected(d)}
            ringsData={ringsData}
            ringLat="lat"
            ringLng="lng"
            ringMaxRadius={5}
            ringPropagationSpeed={2}
            ringRepeatPeriod={900}
            ringColor={() => (t => `rgba(22,148,170,${1 - t})`)}
            atmosphereColor={PM}
            atmosphereAltitude={0.2}
          />
          <Panel d={selected} onClose={() => setSelected(null)} />
          <div id="controls">
            <div className="ctl-label">Altura das torres</div>
            <div className="seg">
              {Object.entries(METRICS).map(([k, m]) => (
                <button
                  key={k}
                  className={k === metric ? 'active' : ''}
                  onClick={() => setMetric(k)}
                >{m.label}</button>
              ))}
            </div>
            <div className="hint">As barras representam: <strong>{M.bars}</strong>.</div>
          </div>
        </React.Fragment>
      );
    }

    ReactDOM.createRoot(document.getElementById('globe')).render(<App />);
  </script>

  <!-- Vercel Analytics: tempo gasto no globo (anônimo/agregado) -->
  <script>
    (function () {
      window.va = window.va || function () { (window.vaq = window.vaq || []).push(arguments); };
      var segStart = Date.now(), accumMs = 0, sent = false;

      function pause()  { if (segStart) { accumMs += Date.now() - segStart; segStart = 0; } }
      function resume() { if (!segStart) { segStart = Date.now(); } }

      function flush() {
        if (sent) return;
        pause();
        var secs = Math.round(accumMs / 1000);
        if (secs >= 2) window.va('event', { name: 'globo_time', data: { seconds: secs } });
        accumMs = 0;   // zera para não contar de novo se a pessoa voltar e sair outra vez
        sent = true;
      }

      // pausa/retoma ao trocar de aba; envia o tempo final ao fechar/sair
      document.addEventListener('visibilitychange', function () {
        if (document.visibilityState === 'hidden') { pause(); flush(); } else { sent = false; resume(); }
      });
      window.addEventListener('pagehide', flush);
    })();
  </script>
</body>
</html>
